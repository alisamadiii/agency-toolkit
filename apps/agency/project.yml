name: Agency
options:
  bundleIdPrefix: com.alisamadi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Agency:
    type: application
    platform: iOS
    sources:
      - Agency
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alisamadi.agency
        PRODUCT_NAME: Agency
        INFOPLIST_FILE: Agency/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Agency/Resources/Agency.entitlements
        # Core NFC needs a real team on the entitlement. Change to your own team id.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: DBW9AS9A96
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_INTERFACE_ORIENTATIONS: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
