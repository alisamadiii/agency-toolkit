# Coolify "Docker Compose" resource — point it at this repo, base directory apps/flows, and this file.
# Coolify builds the image from the Dockerfile and fills the SERVICE_* magic variables automatically.
services:
  flows:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVICE_FQDN_FLOWS_3000
      - DATABASE_URL=postgres://postgres:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/flows
      - BETTER_AUTH_SECRET=${SERVICE_BASE64_64_AUTHSECRET}
      - BETTER_AUTH_URL=${SERVICE_URL_FLOWS}
      # Encrypts secrets. Never change it after first deploy, or stored secrets become unreadable.
      - MASTER_KEY=${SERVICE_BASE64_64_MASTERKEY}
      - ROLE=${ROLE:-all}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-4}
      - RUN_RETENTION_DAYS=${RUN_RETENTION_DAYS:-30}
      # Only the client hub may frame /iframe.
      - EMBED_ALLOWED_ORIGINS=${EMBED_ALLOWED_ORIGINS:-https://app.alisamadii.com}
      - EMBED_DEFAULT_ALLOWED_HOSTS=${EMBED_DEFAULT_ALLOWED_HOSTS:-*}
      # Client hub API (Google Calendar steps). HUB_API_KEY = the hub's FLOWS_HUB_KEY.
      - HUB_API_URL=${HUB_API_URL:-https://api.alisamadii.com}
      - HUB_API_KEY=${HUB_API_KEY:-}
      - TZ=${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=flows
    volumes:
      - flows-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flows-db:
