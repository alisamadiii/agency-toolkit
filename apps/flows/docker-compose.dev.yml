# Local development: Postgres only. Run the app with `pnpm dev`.
name: flows-dev
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '5435:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=flows
    volumes:
      - flows-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flows-dev-db:
